<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rokumon Brain Trainer</title>
  <style>
    :root { --bg:#0f1419; --fg:#e6edf3; --accent:#58a6ff; --good:#3fb950; --bad:#f85149; --card:#161b22; --border:#30363d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:1rem; }
    h1 { margin:0.5rem 0; font-size:1.6rem; }
    .menu { display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center; margin:1rem 0; }
    .mode-btn, button { padding:0.7rem 1.2rem; border:0; border-radius:8px; background:var(--accent); color:#0f1419; font-weight:600; cursor:pointer; font-size:1rem; }
    .mode-btn.active { outline:2px solid #fff; }
    button.secondary { background:#30363d; color:var(--fg); }
    button:disabled { opacity:0.5; cursor:not-allowed; }
    .screen { width:100%; max-width:420px; display:none; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .board { display:grid; grid-template-columns:repeat(3,90px); gap:10px; margin:1rem 0; }
    .cell { width:90px; height:90px; border-radius:14px; background:#21262d; border:2px solid var(--border); cursor:pointer; transition:background .12s, transform .1s; }
    .cell.active { background:var(--accent); transform:scale(0.95); }
    .cell.correct { background:var(--good); }
    .cell.wrong { background:var(--bad); }
    .stats, .info { margin:0.5rem 0; text-align:center; opacity:0.9; }
    .big { font-size:2.5rem; font-weight:700; margin:1rem 0; }
    .reaction-area { width:280px; height:180px; border-radius:16px; background:#21262d; display:flex; align-items:center; justify-content:center; font-size:1.2rem; cursor:pointer; margin:1rem 0; border:2px solid var(--border); transition:background .1s; }
    .reaction-area.wait { background:#f85149; }
    .reaction-area.go { background:var(--good); }
    .pattern { display:grid; grid-template-columns:repeat(4,70px); gap:8px; margin:1rem 0; }
    .p-cell { width:70px; height:70px; border-radius:10px; background:#21262d; border:2px solid var(--border); cursor:pointer; transition:transform .1s; }
    .p-cell.odd { background:#58a6ff; }
    .footer { margin-top:1.5rem; }
  </style>
</head>
<body>
  <h1>Rokumon Brain Trainer</h1>
  <div class="menu">
    <button class="mode-btn active" data-mode="sequence">Sequence</button>
    <button class="mode-btn" data-mode="reaction">Reaction</button>
    <button class="mode-btn" data-mode="pattern">Pattern</button>
  </div>
  <div id="stats" class="stats">Best Sequence: 0 | Best Reaction: — | Pattern Best: 0</div>

  <div id="seq-screen" class="screen active">
    <div class="info">Watch the sequence, then repeat it</div>
    <div class="score" id="seq-score">Level 1</div>
    <div class="board" id="seq-board"></div>
    <button id="seq-start">Start Sequence</button>
  </div>

  <div id="react-screen" class="screen">
    <div class="info">Wait for green, then tap as fast as you can</div>
    <div class="big" id="react-time">Ready</div>
    <div class="reaction-area" id="react-area">Tap to start</div>
    <div class="info" id="react-best">Best: — ms &nbsp;|&nbsp; Avg (last 5): —</div>
  </div>

  <div id="pat-screen" class="screen">
    <div class="info">Find the different colour</div>
    <div class="score" id="pat-score">Round 1</div>
    <div class="pattern" id="pat-board"></div>
    <button id="pat-start">Start Pattern</button>
  </div>

  <div class="footer"><button class="secondary" id="reset-stats">Reset all bests</button></div>

  <script>
    const hubCall = (method, ...args) => { try { const s = window.Hub; if (typeof s?.[method] === 'function') s[method](...args); } catch {} };

    // Simple audio
    let audioCtx;
    function tone(freq, dur=0.12, type='sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    // Stats
    let stats = JSON.parse(localStorage.getItem('rbt-stats') || '{"seq":0,"react":null,"pat":0,"reacts":[]}');
    function saveStats() { localStorage.setItem('rbt-stats', JSON.stringify(stats)); updateStatsDisplay(); }
    function updateStatsDisplay() {
      const avg = stats.reacts && stats.reacts.length ? Math.round(stats.reacts.reduce((a,b)=>a+b,0)/stats.reacts.length) : null;
      document.getElementById('stats').textContent = `Best Sequence: ${stats.seq} | Best Reaction: ${stats.react ? stats.react + ' ms' : '—'} | Pattern Best: ${stats.pat}`;
      document.getElementById('react-best').textContent = `Best: ${stats.react ? stats.react + ' ms' : '—'}  |  Avg (last 5): ${avg ? avg + ' ms' : '—'}`;
    }
    updateStatsDisplay();
    document.getElementById('reset-stats').addEventListener('click', () => {
      if (confirm('Reset all personal bests?')) {
        stats = {seq:0, react:null, pat:0, reacts:[]};
        saveStats();
      }
    });

    // Mode switching
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(btn.dataset.mode === 'sequence' ? 'seq-screen' : btn.dataset.mode === 'reaction' ? 'react-screen' : 'pat-screen').classList.add('active');
      });
    });

    // SEQUENCE
    const seqBoard = document.getElementById('seq-board');
    const seqCells = [];
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div'); c.className = 'cell'; c.dataset.i = i;
      c.addEventListener('click', () => seqClick(i));
      seqBoard.appendChild(c); seqCells.push(c);
    }
    let seq = [], pIdx = 0, level = 1, playingSeq = false, inputOk = false;
    const seqScore = document.getElementById('seq-score');
    const seqStart = document.getElementById('seq-start');

    function flash(i, cls='active') {
      return new Promise(r => {
        seqCells[i].classList.add(cls);
        if (cls === 'active') tone(440 + i*30, 0.18);
        else if (cls === 'correct') tone(660, 0.1);
        else if (cls === 'wrong') tone(180, 0.3, 'sawtooth');
        setTimeout(() => { seqCells[i].classList.remove(cls); setTimeout(r, 100); }, 380);
      });
    }
    async function playSeq() {
      inputOk = false;
      for (const i of seq) await flash(i);
      inputOk = true; pIdx = 0;
    }
    function nextSeq() {
      seq.push(Math.floor(Math.random()*9));
      level = seq.length;
      seqScore.textContent = `Level ${level}`;
      if (level > stats.seq) { stats.seq = level; saveStats(); hubCall('score', level); }
      setTimeout(playSeq, 500);
    }
    function seqClick(i) {
      if (!inputOk || !playingSeq) return;
      if (i === seq[pIdx]) {
        flash(i, 'correct');
        pIdx++;
        if (pIdx === seq.length) {
          inputOk = false;
          hubCall('event', 'sequence-completed', { level });
          setTimeout(nextSeq, 400);
        }
      } else {
        flash(i, 'wrong');
        inputOk = false; playingSeq = false;
        hubCall('gameOver', stats.seq, 0);
        seqStart.disabled = false; seqStart.textContent = 'Try again';
      }
    }
    seqStart.addEventListener('click', () => {
      seq = []; level = 1; playingSeq = true; seqStart.disabled = true;
      hubCall('ready'); nextSeq();
    });

    // REACTION
    const reactArea = document.getElementById('react-area');
    const reactTime = document.getElementById('react-time');
    let reactState = 'idle', startTime = 0, timeoutId;
    reactArea.addEventListener('click', () => {
      if (reactState === 'idle' || reactState === 'done') {
        reactState = 'waiting';
        reactArea.textContent = 'Wait for green…';
        reactArea.className = 'reaction-area wait';
        reactTime.textContent = '';
        const delay = 800 + Math.random()*2200;
        timeoutId = setTimeout(() => {
          reactState = 'go';
          reactArea.className = 'reaction-area go';
          reactArea.textContent = 'TAP!';
          tone(880, 0.08);
          startTime = performance.now();
        }, delay);
      } else if (reactState === 'waiting') {
        clearTimeout(timeoutId);
        reactState = 'done';
        reactArea.className = 'reaction-area';
        reactArea.textContent = 'Too early! Tap to retry';
        reactTime.textContent = 'Early';
        tone(180, 0.25, 'sawtooth');
      } else if (reactState === 'go') {
        const ms = Math.round(performance.now() - startTime);
        reactState = 'done';
        reactArea.className = 'reaction-area';
        reactArea.textContent = `${ms} ms — Tap to retry`;
        reactTime.textContent = ms + ' ms';
        tone(520, 0.1);
        if (!stats.reacts) stats.reacts = [];
        stats.reacts.push(ms);
        if (stats.reacts.length > 5) stats.reacts.shift();
        if (!stats.react || ms < stats.react) {
          stats.react = ms; hubCall('score', 1000 - Math.min(ms, 999));
          hubCall('event', 'reaction-best', { ms });
        }
        saveStats();
        hubCall('event', 'reaction-completed', { ms });
      }
    });

    // PATTERN
    const patBoard = document.getElementById('pat-board');
    const patScore = document.getElementById('pat-score');
    const patStart = document.getElementById('pat-start');
    let patRound = 1, patPlaying = false, oddIndex = -1;
    const patCells = [];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('div'); c.className = 'p-cell';
      c.addEventListener('click', () => patClick(i));
      patBoard.appendChild(c); patCells.push(c);
    }
    function startPatRound() {
      patCells.forEach(c => c.className = 'p-cell');
      oddIndex = Math.floor(Math.random()*16);
      patCells[oddIndex].classList.add('odd');
      patScore.textContent = `Round ${patRound}`;
    }
    function patClick(i) {
      if (!patPlaying) return;
      if (i === oddIndex) {
        tone(620, 0.08);
        patRound++;
        if (patRound - 1 > stats.pat) { stats.pat = patRound - 1; saveStats(); hubCall('score', stats.pat); }
        hubCall('event', 'pattern-correct', { round: patRound - 1 });
        startPatRound();
      } else {
        tone(180, 0.25, 'sawtooth');
        patPlaying = false;
        hubCall('gameOver', stats.pat, 0);
        patStart.disabled = false; patStart.textContent = 'Try again';
        patScore.textContent = `Missed! Best ${stats.pat}`;
      }
    }
    patStart.addEventListener('click', () => {
      patRound = 1; patPlaying = true; patStart.disabled = true;
      hubCall('ready'); startPatRound();
    });

    hubCall('ready');
  </script>
</body>
</html>
