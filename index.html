            "A wrong tile or an empty bar ends the run. Your best is the longest streak.",
          ],
        },
        count: {
          kicker: "Focus",
          title: "Count",
          panel: "count",
          icon: '<svg viewBox="0 0 32 32" fill="none" stroke="#f0c15a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11l3-2v9"/><path d="M14 10.5c0-2 4.5-2 4.5.3 0 2-4.5 4.200-4.500 7.200H19"/><path d="M23 9.500h4l-2.500 3.500c2 0 3 1 3 2.500 0 2.800-4 3.200-5 1.200"/><path d="M6 24h20"/></svg>',
          summary: "Sixteen numbers in a jumble. Tap them from 1 to 16 as fast as you can.",
          steps: [
            "Find 1, then 2, then 3, and so on up to 16.",
            "A wrong tap adds one second to your time.",
            "Your best is the fastest clear.",
          ],
        },
        sums: {
          kicker: "Sums",
          title: "Quick Sums",
          panel: "prompt",
          icon: '<svg viewBox="0 0 32 32" fill="none" stroke="#f0c15a" stroke-width="2.2" stroke-linecap="round"><path d="M6 11h9M10.500 6.500v9"/><path d="M19 9l7 7M26 9l-7 7" stroke-width="1.8"/><path d="M6 21h9M6 26h9"/><path d="M19 23.500h8" /></svg>',
          summary: "Forty-five seconds of mental arithmetic. Pick the right answer from four.",
          steps: [
            "Read the sum and tap the answer.",
            "A wrong answer costs three seconds.",
            "The sums get harder as you go. Your best is the most correct answers.",
          ],
        },
        colour: {
          kicker: "Control",
          title: "Colour Clash",
          panel: "prompt",
          icon: '<svg viewBox="0 0 32 32" fill="none"><path d="M16 4c4 5 8 9 8 14a8 8 0 01-16 0c0-5 4-9 8-14z" fill="#f0c15a"/><path d="M12 19a4 4 0 004 4" stroke="#1a1408" stroke-width="1.8" stroke-linecap="round"/></svg>',
          summary: "A colour word appears, printed in a different colour. Answer with the colour of the ink, not the word.",
          steps: [
            "Ignore what the word says.",
            "Tap the button that names the colour the word is printed in.",
            "Thirty seconds. A wrong answer costs two seconds. Your best is the most correct answers.",
          ],
        },
      };

      /* ---------- Elements and storage ---------- */
      const $ = (id) => document.getElementById(id);
      const app = $("app");
      const views = { menu: $("view-menu"), play: $("view-play"), result: $("view-result") };
      const sheet = $("sheet");
      const sheetTitle = $("sheet-title");
      const sheetBody = $("sheet-body");
      const sheetActions = $("sheet-actions");
      const sheetPrimary = $("sheet-primary");
      const sheetSecondary = $("sheet-secondary");
      const muteBtn = $("mute-btn");
      const statusEl = $("status");
      const hudLeft = $("hud-left");
      const hudRight = $("hud-right");
      const timebar = $("timebar");
      const timebarFill = $("timebar-fill");
      const answersEl = $("answers");
      const answerBtns = Array.from(answersEl.querySelectorAll(".answer"));
      const promptEl = $("prompt");
      const promptHint = $("prompt-hint");

      const store = {
        get(key) { try { return localStorage.getItem(key); } catch (err) { return null; } },
        set(key, value) { try { localStorage.setItem(key, value); } catch (err) { /* storage may be blocked */ } },
      };
      const readJSON = (key) => { try { return JSON.parse(store.get(key) || "null"); } catch (err) { return null; } };

      let audioCtx = null;
      let muted = store.get("rbt-muted") === "1";
      let haptics = store.get("rbt-haptics") !== "0";
      let mode = null;
      let live = false;
      let runId = 0;
      let frozen = false;
      let frozenWaiters = [];
      let sheetPrimaryFn = () => {};
      let sheetSecondaryFn = () => closeSheet();
      let sheetDismissFn = () => closeSheet();

      const rnd = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
      const shuffle = (list) => {
        for (let i = list.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      /* Game inputs fire on touch-down, not on finger lift. Keyboard activation still works. */
      function onTap(el, fn) {
        el.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          fn(event);
        });
        el.addEventListener("click", (event) => { if (event.detail === 0) fn(event); });
      }
      document.addEventListener("contextmenu", (event) => {
        if (!event.target.closest("input, textarea")) event.preventDefault();
      });

      /* ---------- Sound and haptics ---------- */
      function unlockAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) audioCtx = new AC({ latencyHint: "interactive" });
        if (audioCtx.state === "suspended") audioCtx.resume();
      }
      document.addEventListener("pointerdown", unlockAudio, { passive: true });
      document.addEventListener("keydown", unlockAudio);

      function tone(freq, dur, type, peak, delay) {
        if (muted || !audioCtx || audioCtx.state !== "running") return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(peak || 0.08, t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }
      const PAD_NOTES = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5, 1174.66];
      const sndPad = (i) => tone(PAD_NOTES[i] || 660, 0.18, "sine", 0.1);
      const sndTick = () => tone(988, 0.05, "sine", 0.05);
      const sndStep = (i) => tone(440 * Math.pow(2, i / 12), 0.07, "triangle", 0.07);
      const sndClear = () => { tone(659, 0.09, "triangle", 0.08, 0); tone(880, 0.14, "sine", 0.08, 0.08); };
      const sndFail = () => { tone(196, 0.22, "sawtooth", 0.045, 0); tone(146, 0.28, "square", 0.03, 0.06); };
      const sndGo = () => { tone(1480, 0.045, "square", 0.04, 0); tone(880, 0.1, "sine", 0.09, 0.02); };
      const sndHit = () => { tone(740, 0.06, "triangle", 0.07, 0); tone(1175, 0.1, "sine", 0.06, 0.05); };
      const sndEarly = () => { tone(210, 0.12, "square", 0.045, 0); tone(170, 0.16, "sawtooth", 0.03, 0.05); };
      const sndPattern = () => tone(720, 0.07, "triangle", 0.07);
      const sndEnd = () => { tone(523, 0.1, "triangle", 0.07, 0); tone(659, 0.1, "triangle", 0.07, 0.09); tone(784, 0.18, "sine", 0.08, 0.18); };
      const sndBest = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, "triangle", 0.08, i * 0.09)); tone(1319, 0.3, "sine", 0.08, 0.38); };

      function buzz(pattern) {
        if (!haptics || !navigator.vibrate) return;
        if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
        try { navigator.vibrate(pattern); } catch (err) { /* not supported */ }
      }
      const BUZZ = { tap: 8, good: 14, bad: [30, 40, 30], end: [20, 50, 20], best: [20, 40, 20, 40, 60] };

      function paintMute() {
        muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
        muteBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
      }
      function setMuted(next) {
        muted = next;
        store.set("rbt-muted", muted ? "1" : "0");
        paintMute();
        if (!muted) sndTick();
      }
      paintMute();
      muteBtn.addEventListener("click", () => { unlockAudio(); setMuted(!muted); });

      /* ---------- Stats and the daily crest ---------- */
      function loadStats() {
        const raw = readJSON("rbt-stats");
        if (!raw || typeof raw !== "object") return { seq: 0, react: null, pat: 0, reacts: [], count: null, sums: 0, colour: 0 };
        const reacts = Array.isArray(raw.reacts) ? raw.reacts.map(Number).filter((n) => n > 0).slice(-5) : [];
        return {
          seq: Number(raw.seq) || 0,
          react: raw.react == null ? null : (Number(raw.react) || null),
          pat: Number(raw.pat) || 0,
          reacts,
          count: raw.count == null ? null : (Number(raw.count) || null),
          sums: Number(raw.sums) || 0,
          colour: Number(raw.colour) || 0,
        };
      }
      let stats = loadStats();
      const saveStats = () => { store.set("rbt-stats", JSON.stringify(stats)); };
      const secs = (ms) => (ms / 1000).toFixed(1);

      function bestText(id) {
        if (id === "sequence") return stats.seq ? "Best level " + stats.seq : "";
        if (id === "reaction") return stats.react ? "Best " + stats.react + " ms" : "";
        if (id === "pattern") return stats.pat ? "Best streak " + stats.pat : "";
        if (id === "count") return stats.count ? "Best " + secs(stats.count) + " s" : "";
        if (id === "sums") return stats.sums ? "Best " + stats.sums + " correct" : "";
        return stats.colour ? "Best " + stats.colour + " correct" : "";
      }

      const dayKey = (d) => {
        const date = d || new Date();
        return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
      };
      function loadDaily() {
        const raw = readJSON("rbt-daily");
        if (raw && raw.days && typeof raw.days === "object") return { days: raw.days };
        return { days: {} };
      }
      let daily = loadDaily();
      const gatesOn = (key) => (Array.isArray(daily.days[key]) ? daily.days[key].filter((id) => ORDER.includes(id)) : []);
      const gatesToday = () => gatesOn(dayKey());
      function streak() {
        let n = 0;
        const d = new Date();
        if (gatesOn(dayKey(d)).length < GOAL) d.setDate(d.getDate() - 1);
        while (gatesOn(dayKey(d)).length >= GOAL && n < 3660) {
          n += 1;
          d.setDate(d.getDate() - 1);
        }
        return n;
      }
      function markGate(id) {
        const key = dayKey();
        const list = gatesOn(key);
        if (list.includes(id)) return false;
        list.push(id);
        daily.days[key] = list;
        const keep = Object.keys(daily.days).sort().slice(-90);
        const pruned = {};
        keep.forEach((k) => { pruned[k] = daily.days[k]; });
        daily.days = pruned;
        store.set("rbt-daily", JSON.stringify(daily));
        hubCall("event", "gate-passed", { gate: ORDER.indexOf(id) + 1, drill: id, today: list.length });
        if (list.length === ORDER.length) hubCall("event", "crest-complete", { streak: streak() });
        return true;
      }
      const nextGate = () => ORDER.find((id) => !gatesToday().includes(id)) || null;

      const SVG_NS = "http://www.w3.org/2000/svg";
      function svgEl(name, attrs) {
        const el = document.createElementNS(SVG_NS, name);
        Object.keys(attrs).forEach((key) => el.setAttribute(key, attrs[key]));
        return el;
      }
      function paintCrest(host, freshId) {
        const passed = gatesToday();
        const svg = svgEl("svg", { viewBox: "0 0 100 100" });
        const pts = ORDER.map((id, i) => {
          const a = (-90 + i * 60) * Math.PI / 180;
          return { id, x: 50 + 36 * Math.cos(a), y: 50 + 36 * Math.sin(a) };
        });
        svg.appendChild(svgEl("polygon", { class: "ring", points: pts.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ") }));
        svg.appendChild(svgEl("circle", { class: "core", cx: 50, cy: 50, r: 15 }));
        const label = svgEl("text", { x: 50, y: 50.5 });
        label.textContent = String(passed.length);
        svg.appendChild(label);
        pts.forEach((p) => {
          const on = passed.includes(p.id);
          svg.appendChild(svgEl("circle", {
            class: "gate" + (on ? " on" : "") + (on && p.id === freshId ? " fresh" : ""),
            cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 8,
          }));
        });
        host.classList.toggle("full", passed.length === ORDER.length);
        host.replaceChildren(svg);
      }

      function dayCopy() {
        const done = gatesToday().length;
        const run = streak();
        const title = done + " of " + ORDER.length + " gates";
        let sub;
        if (done === ORDER.length) sub = "All six gates passed today.";
        else if (done >= GOAL) sub = "Streak safe. " + (ORDER.length - done) + " more for the full crest.";
        else if (run > 0) sub = (GOAL - done) + " more to keep your " + run + "-day streak.";
        else sub = (GOAL - done) + " more to start a streak.";
        return { done, run, title, sub };
      }

      /* ---------- Home ---------- */
      const tilesHost = $("tiles");
      const tileEls = {};
      ORDER.forEach((id, i) => {
        const info = DRILLS[id];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile";
        btn.innerHTML =
          '<span class="tile-head"><span class="tile-icon" aria-hidden="true">' + info.icon + "</span>" +
          '<span class="tile-tick" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="#1a1408" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.500 6.300 5 8.700 9.500 3.500"/></svg></span></span>' +
          '<span class="tile-kicker"></span><span class="tile-name"></span><span class="tile-best"></span>';
        btn.querySelector(".tile-kicker").textContent = "Gate " + (i + 1) + " · " + info.kicker;
        btn.querySelector(".tile-name").textContent = info.title;
        btn.addEventListener("click", () => { unlockAudio(); startMode(id); });
        tilesHost.appendChild(btn);
        tileEls[id] = btn;
      });

      function paintHome() {
        const passed = gatesToday();
        const copy = dayCopy();
        paintCrest($("home-crest"));
        $("today-title").textContent = copy.title;
        $("today-sub").textContent = copy.sub;
        const next = nextGate();
        $("train-btn").textContent = !next
          ? "Free play: " + DRILLS[ORDER[rnd(0, ORDER.length - 1)]].title
          : passed.length ? "Next gate: " + DRILLS[next].title : "Start training";
        $("train-btn").dataset.target = next || "";

        const week = $("week");
        week.replaceChildren();
        const names = ["S", "M", "T", "W", "T", "F", "S"];
        for (let back = 6; back >= 0; back -= 1) {
          const d = new Date();
          d.setDate(d.getDate() - back);
          const n = gatesOn(dayKey(d)).length;
          const cell = document.createElement("span");
          cell.className = (n >= GOAL ? "met" : n > 0 ? "some" : "") + (back === 0 ? " now" : "");
          cell.appendChild(document.createElement("i"));
          cell.appendChild(document.createTextNode(names[d.getDay()]));
          week.appendChild(cell);
        }

        ORDER.forEach((id) => {
          const el = tileEls[id];
          const best = bestText(id);
          const bestEl = el.querySelector(".tile-best");
          bestEl.textContent = best || "Not played yet";
          bestEl.classList.toggle("none", !best);
          el.classList.toggle("passed", passed.includes(id));
          el.setAttribute("aria-label", DRILLS[id].title + ". " + (best || "Not played yet") + (passed.includes(id) ? ". Passed today" : ""));
        });
      }

      $("train-btn").addEventListener("click", () => {
        unlockAudio();
        const target = $("train-btn").dataset.target;
        startMode(target || ORDER[rnd(0, ORDER.length - 1)]);
      });

      /* ---------- Views, sheet, freeze ---------- */
      function showView(name) {
        Object.keys(views).forEach((key) => views[key].classList.toggle("on", key === name));
      }
      function showMenu() {
        stopAll();
        mode = null;
        closeSheet();
        paintHome();
        showView("menu");
      }
      function showPlay(next) {
        mode = next;
        const info = DRILLS[next];
        $("play-kicker").textContent = "Gate " + (ORDER.indexOf(next) + 1) + " · " + info.kicker;
        $("play-title").textContent = info.title;
        document.querySelectorAll(".panel").forEach((panel) => panel.classList.remove("on"));
        $("panel-" + info.panel).classList.add("on");
        answersEl.hidden = info.panel !== "prompt";
        setBar(null);
        showView("play");
      }

      function setFrozen(next) {
        frozen = next;
        app.classList.toggle("is-frozen", next);
        if (next) seqCells.forEach((cell) => cell.classList.remove("lit"));
        if (!next) {
          const queue = frozenWaiters;
          frozenWaiters = [];
          queue.forEach((fn) => fn());
        }
      }
      function waitWhileFrozen() {
        if (!frozen) return Promise.resolve();
        return new Promise((resolve) => frozenWaiters.push(resolve));
      }

      function openSheet(opts) {
        sheetTitle.textContent = opts.title;
        sheetBody.replaceChildren();
        (opts.paragraphs || []).forEach((text) => {
          const p = document.createElement("p");
          p.textContent = text;
          sheetBody.appendChild(p);
        });
        if (opts.steps) {
          const ul = document.createElement("ul");
          opts.steps.forEach((text) => {
            const li = document.createElement("li");
            li.textContent = text;
            ul.appendChild(li);
          });
          sheetBody.appendChild(ul);
        }
        if (opts.build) opts.build(sheetBody);
        sheetPrimary.textContent = opts.primary || "OK";
        sheetPrimary.className = "btn" + (opts.danger ? " danger" : "");
        sheetPrimaryFn = opts.onPrimary || closeSheet;
        if (opts.secondary) {
          sheetSecondary.hidden = false;
          sheetSecondary.textContent = opts.secondary;
          sheetSecondaryFn = opts.onSecondary || closeSheet;
        } else {
          sheetSecondary.hidden = true;
          sheetSecondaryFn = closeSheet;
        }
        sheetDismissFn = opts.onDismiss || sheetSecondaryFn;
        sheetActions.classList.toggle("single", !opts.secondary);
        sheet.hidden = false;
        sheetPrimary.focus({ preventScroll: true });
      }
      function closeSheet() {
        if (sheet.hidden) return;
        sheet.hidden = true;
        if (sheet.contains(document.activeElement)) document.activeElement.blur();
      }
      sheetPrimary.addEventListener("click", () => sheetPrimaryFn());
      sheetSecondary.addEventListener("click", () => sheetSecondaryFn());
      sheet.addEventListener("click", (event) => { if (event.target === sheet) sheetDismissFn(); });

      /* ---------- Shared play helpers ---------- */
      function setHud(leftLabel, leftValue, rightLabel, rightValue) {
        const fill = (host, label, value) => {
          host.replaceChildren();
          if (label == null) return;
          host.appendChild(document.createTextNode(label));
          const b = document.createElement("b");
          b.textContent = value;
          host.appendChild(b);
        };
        fill(hudLeft, leftLabel, leftValue);
        fill(hudRight, rightLabel, rightValue);
      }
      function setBar(frac) {
        if (frac == null) {
          timebar.classList.add("off");
          timebar.classList.remove("low");
          timebarFill.style.transform = "scaleX(1)";
          return;
        }
        const f = Math.max(0, Math.min(1, frac));
        timebar.classList.remove("off");
        timebar.classList.toggle("low", f < 0.25);
        timebarFill.style.transform = "scaleX(" + f.toFixed(3) + ")";
      }

      /* A clock that stands still while the game is paused. */
      let clock = null;
      function stopClock() {
        if (clock) {
          clearInterval(clock.timer);
          clock = null;
        }
      }
      function startClock(opts) {
        stopClock();
        const c = { elapsed: 0, last: performance.now(), timer: 0 };
        c.timer = setInterval(() => {
          const now = performance.now();
          const dt = Math.min(150, now - c.last);
          c.last = now;
          if (clock !== c) return;
          if (!frozen) c.elapsed += dt;
          if (opts.onTick) opts.onTick(c.elapsed);
          if (clock === c && opts.duration && c.elapsed >= opts.duration) {
            stopClock();
            if (opts.onEnd) opts.onEnd();
          }
        }, 40);
        clock = c;
        return c;
      }

      const pulseTimers = new WeakMap();
      function pulse(cell, cls, ms) {
        const prev = pulseTimers.get(cell);
        if (prev) clearTimeout(prev);
        cell.classList.remove("good", "bad", "lit", "reveal");
        void cell.offsetWidth;
        cell.classList.add(cls);
        return new Promise((resolve) => {
          const id = setTimeout(() => {
            if (pulseTimers.get(cell) === id) {
              cell.classList.remove(cls);
              pulseTimers.delete(cell);
            }
            resolve();
          }, ms);
          pulseTimers.set(cell, id);
        });
      }
      function flash(el, cls) {
        el.classList.remove("bad", "swap");
        void el.offsetWidth;
        el.classList.add(cls);
      }

      function stopAll() {
        runId += 1;
        live = false;
        stopClock();
        clearReactTimer();
        inputOk = false;
        answerFn = null;
        setFrozen(false);
        seqBoard.classList.add("locked");
      }

      /* ---------- Result ---------- */
      function burst() {
        const hero = $("res-hero");
        hero.querySelectorAll(".spark").forEach((el) => el.remove());
        const colours = ["#f0c15a", "#ffe7a8", "#5ee0c4", "#e7eef8"];
        for (let i = 0; i < 18; i += 1) {
          const s = document.createElement("i");
          s.className = "spark";
          const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.4;
          const dist = 90 + Math.random() * 80;
          s.style.setProperty("--dx", Math.round(Math.cos(angle) * dist) + "px");
          s.style.setProperty("--dy", Math.round(Math.sin(angle) * dist) + "px");
          s.style.background = colours[i % colours.length];
          s.style.animationDelay = Math.round(Math.random() * 120) + "ms";
          hero.appendChild(s);
        }
        setTimeout(() => hero.querySelectorAll(".spark").forEach((el) => el.remove()), 1300);
      }

      function finish(id, res) {
        const info = DRILLS[id];
        live = false;
        stopClock();
        saveStats();
        const fresh = markGate(id);
        const copy = dayCopy();

        $("res-kicker").textContent = "Gate " + (ORDER.indexOf(id) + 1) + " · " + info.kicker;
        $("res-title").textContent = info.title;
        $("res-value").textContent = res.value;
        $("res-unit").textContent = res.unit || "";
        $("res-line").textContent = res.line;
        $("res-badge").hidden = !res.isBest;
        $("res-best").textContent = res.isBest ? "" : bestText(id);
        paintCrest($("res-crest"), fresh ? id : null);
        $("res-day-title").textContent = fresh ? "Gate passed. " + copy.title + " today" : copy.title + " today";
        $("res-day-sub").textContent = copy.sub;

        const next = nextGate();
        const nextBtn = $("res-next");
        nextBtn.textContent = next ? "Next gate: " + DRILLS[next].title : "Back to home";
        nextBtn.dataset.target = next || "";
        $("res-again").dataset.target = id;

        mode = null;
        showView("result");
        const value = $("res-value").parentElement;
        value.style.animation = "none";
        void value.offsetWidth;
        value.style.animation = "";
        if (res.isBest) {
          sndBest();
          buzz(BUZZ.best);
          burst();
        } else {
          sndEnd();
          buzz(BUZZ.end);
        }
      }
      $("res-next").addEventListener("click", () => {
        const target = $("res-next").dataset.target;
        if (target) startMode(target); else showMenu();
      });
      $("res-again").addEventListener("click", () => startMode($("res-again").dataset.target));
      $("res-home").addEventListener("click", showMenu);

      /* ---------- Gate 1: Sequence ---------- */
      const seqBoard = $("panel-sequence");
      const seqCells = [];
      for (let i = 0; i < 9; i += 1) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.setAttribute("aria-label", "Pad " + (i + 1));
        onTap(cell, () => seqClick(i));
        seqBoard.appendChild(cell);
        seqCells.push(cell);
      }
      let seq = [];
      let pIdx = 0;
      let level = 1;
      let inputOk = false;
      let seqBestAtStart = 0;

      function setSeqHud() {
        setHud("Level", String(level), "Best", stats.seq ? String(stats.seq) : "-");
      }
      function beginSequence() {
        showPlay("sequence");
        seq = [];
        pIdx = 0;
        level = 1;
        inputOk = false;
        seqBestAtStart = stats.seq;
        seqBoard.classList.add("locked");
        seqCells.forEach((cell) => cell.classList.remove("lit", "good", "bad"));
        live = true;
        const token = runId;
        statusEl.textContent = "Watch carefully";
        setSeqHud();
        setTimeout(() => { nextSeq(token); }, 420);
      }
      async function nextSeq(token) {
        if (token !== runId) return;
        await waitWhileFrozen();
        if (token !== runId) return;
        seq.push(Math.floor(Math.random() * 9));
        level = seq.length;
        if (level > stats.seq) {
          stats.seq = level;
          saveStats();
          hubCall("score", level);
        }
        setSeqHud();
        statusEl.textContent = "Watch";
        await sleep(460);
        if (token !== runId) return;
        await waitWhileFrozen();
        if (token !== runId) return;
        playSeq(token);
      }
      async function playSeq(token) {
        inputOk = false;
        seqBoard.classList.add("locked");
        const litMs = Math.max(230, 430 - seq.length * 14);
        const gapMs = Math.max(80, 140 - seq.length * 4);
        for (let step = 0; step < seq.length; step += 1) {
          if (token !== runId) return;
          await waitWhileFrozen();
          if (token !== runId) return;
          const index = seq[step];
          statusEl.textContent = "Watch " + (step + 1) + " / " + seq.length;
          sndPad(index);
          await pulse(seqCells[index], "lit", litMs);
          if (token !== runId) return;
          await sleep(gapMs);
        }
        if (token !== runId) return;
        pIdx = 0;
        inputOk = true;
        seqBoard.classList.remove("locked");
        statusEl.textContent = "Your turn · 0 / " + seq.length;
      }
      function seqClick(i) {
        if (!inputOk || frozen || mode !== "sequence") return;
        const token = runId;
        if (i === seq[pIdx]) {
          sndPad(i);
          buzz(BUZZ.tap);
          pulse(seqCells[i], "good", 180);
          pIdx += 1;
          statusEl.textContent = "Your turn · " + pIdx + " / " + seq.length;
          if (pIdx === seq.length) {
            inputOk = false;
            seqBoard.classList.add("locked");
            sndClear();
            buzz(BUZZ.good);
            statusEl.textContent = "Correct";
            hubCall("event", "sequence-completed", { level });
            setTimeout(() => nextSeq(token), 520);
          }
        } else {
          inputOk = false;
          live = false;
          seqBoard.classList.add("locked");
          sndFail();
          buzz(BUZZ.bad);
          pulse(seqCells[i], "bad", 380);
          pulse(seqCells[seq[pIdx]], "lit", 700);
          statusEl.textContent = "Missed";
          hubCall("gameOver", stats.seq, 0);
          const reached = level;
          setTimeout(() => {
            if (token !== runId) return;
            finish("sequence", {
              value: String(reached),
              line: reached === 1 ? "Level reached" : "Level reached, a path of " + reached,
              isBest: reached > 1 && reached > seqBestAtStart,
            });
          }, 850);
        }
      }

      /* ---------- Gate 2: Reaction ---------- */
      const arena = $("react-area");
      const readout = $("react-readout");
      let reactState = "idle";
      let reactEpoch = 0;
      let reactTimer = 0;
      let reactStart = 0;
      let reactTries = [];
      let reactBestAtStart = null;

      function paintReactHud() {
        hudLeft.replaceChildren();
        const pips = document.createElement("span");
        pips.className = "pips";
        for (let i = 0; i < REACT_TRIES; i += 1) {
          const dot = document.createElement("i");
          if (i < reactTries.length) dot.className = "on";
          pips.appendChild(dot);
        }
        hudLeft.appendChild(pips);
        hudRight.replaceChildren(document.createTextNode("Best"));
        const b = document.createElement("b");
        b.textContent = stats.react ? stats.react + " ms" : "-";
        hudRight.appendChild(b);
      }
      function paintReaction(state, label, readoutText) {
        reactState = state;
        arena.classList.remove("is-wait", "is-go", "is-early");
        if (state === "waiting") arena.classList.add("is-wait");
        if (state === "go") arena.classList.add("is-go");
        if (state === "early") arena.classList.add("is-early");
        arena.textContent = label;
        readout.textContent = readoutText;
      }
      function clearReactTimer() {
        if (reactTimer) clearTimeout(reactTimer);
        reactTimer = 0;
      }
      function beginReaction() {
        showPlay("reaction");
        reactEpoch += 1;
        reactTries = [];
        reactBestAtStart = stats.react;
        live = true;
        paintReaction("idle", "Tap to start", "Ready");
        paintReactHud();
        statusEl.textContent = "Five tries. Tap the panel to arm the first.";
      }
      function armReaction() {
        const epoch = ++reactEpoch;
        paintReaction("waiting", "Wait", "Hold");
        statusEl.textContent = "Wait for mint.";
        const delay = 900 + Math.random() * 2300;
        clearReactTimer();
        reactTimer = setTimeout(() => {
          if (epoch !== reactEpoch || frozen) return;
          paintReaction("go", "TAP", "Now");
          statusEl.textContent = "Tap now.";
          sndGo();
          reactStart = performance.now();
          /* Start the clock from the frame that shows the signal, where the browser allows it. */
          requestAnimationFrame(() => { if (epoch === reactEpoch && reactState === "go") reactStart = performance.now(); });
        }, delay);
      }
      function finishReaction(ms) {
        const token = runId;
        reactEpoch += 1;
        clearReactTimer();
        reactState = "done";
        arena.classList.remove("is-wait", "is-go", "is-early");
        readout.replaceChildren(document.createTextNode(String(ms)));
        const unit = document.createElement("span");
        unit.textContent = "ms";
        readout.appendChild(unit);
        sndHit();
        buzz(BUZZ.good);
        reactTries.push(ms);
        stats.reacts.push(ms);
        if (stats.reacts.length > 5) stats.reacts.shift();
        if (!stats.react || ms < stats.react) {
          stats.react = ms;
          hubCall("score", 1000 - Math.min(ms, 999));
          hubCall("event", "reaction-best", { ms });
        }
        saveStats();
        hubCall("event", "reaction-completed", { ms });
        paintReactHud();
        if (reactTries.length >= REACT_TRIES) {
          reactState = "locked";
          arena.textContent = "Done";
          statusEl.textContent = "Set complete.";
          const avg = Math.round(reactTries.reduce((a, b) => a + b, 0) / reactTries.length);
          const fastest = Math.min(...reactTries);
          setTimeout(() => {
            if (token !== runId) return;
            finish("reaction", {
              value: String(avg),
              unit: "ms",
              line: "Average of five. Fastest " + fastest + " ms",
              isBest: reactBestAtStart == null || fastest < reactBestAtStart,
            });
          }, 750);
          return;
        }
        arena.textContent = "Tap for try " + (reactTries.length + 1);
        statusEl.textContent = ms < 220 ? "Sharp." : ms < 320 ? "Clean." : "Room to tighten.";
      }
      onTap(arena, () => {
        if (mode !== "reaction" || frozen) return;
        if (reactState === "idle" || reactState === "done" || reactState === "early") {
          buzz(BUZZ.tap);
          armReaction();
          return;
        }
        if (reactState === "waiting") {
          reactEpoch += 1;
          clearReactTimer();
          paintReaction("early", "Too soon", "Early");
          statusEl.textContent = "That one does not count. Tap to arm again.";
          sndEarly();
          buzz(BUZZ.bad);
          return;
        }
        if (reactState === "go") finishReaction(Math.max(1, Math.round(performance.now() - reactStart)));
      });

      /* ---------- Gate 3: Pattern ---------- */
      const patBoard = $("panel-pattern");
      const patCells = [];
      for (let i = 0; i < 16; i += 1) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "pcell";
        cell.setAttribute("aria-label", "Tile " + (i + 1));
        onTap(cell, () => patClick(i));
        patBoard.appendChild(cell);
        patCells.push(cell);
      }
      let patRound = 1;
      let patOpen = false;
      let oddIndex = -1;
      let patBestAtStart = 0;

      function colorsForRound(round) {
        const base = { h: 214, s: 18, l: 28 };
        const start = { h: 166, s: 64, l: 62 };
        const t = Math.min(0.8, (round - 1) * 0.055);
        const odd = {
          h: start.h + (base.h - start.h) * t,
          s: start.s + (base.s - start.s) * t,
          l: start.l + (base.l - start.l) * t,
        };
        const hsl = (c) => "hsl(" + c.h.toFixed(1) + " " + c.s.toFixed(1) + "% " + c.l.toFixed(1) + "%)";
        return { base: hsl(base), odd: hsl(odd) };
      }
      function dealPattern() {
        oddIndex = Math.floor(Math.random() * 16);
        const colors = colorsForRound(patRound);
        patCells.forEach((cell, i) => {
          cell.style.background = i === oddIndex ? colors.odd : colors.base;
          cell.classList.remove("good", "bad", "reveal");
        });
        setHud("Round", String(patRound), "Best", stats.pat ? String(stats.pat) : "-");
        statusEl.textContent = "Find the different colour.";
        patOpen = true;
        const limit = Math.max(2500, 6000 - (patRound - 1) * 250);
        setBar(1);
        startClock({
          duration: limit,
          onTick: (elapsed) => setBar(1 - elapsed / limit),
          onEnd: () => patFail(-1),
        });
      }
      function beginPattern() {
        showPlay("pattern");
        patRound = 1;
        patBestAtStart = stats.pat;
        live = true;
        dealPattern();
      }
      function patFail(i) {
        const token = runId;
        patOpen = false;
        live = false;
        stopClock();
        sndFail();
        buzz(BUZZ.bad);
        if (i >= 0) pulse(patCells[i], "bad", 360);
        patCells[oddIndex].classList.add("reveal");
        const cleared = Math.max(0, patRound - 1);
        statusEl.textContent = i >= 0 ? "Missed" : "Out of time";
        hubCall("gameOver", stats.pat, 0);
        setTimeout(() => {
          if (token !== runId) return;
          finish("pattern", {
            value: String(cleared),
            line: cleared === 1 ? "Tile found in a row" : "Tiles found in a row",
            isBest: cleared > patBestAtStart,
          });
        }, 950);
      }
      function patClick(i) {
        if (!patOpen || frozen || mode !== "pattern") return;
        if (i !== oddIndex) { patFail(i); return; }
        patOpen = false;
        stopClock();
        sndPattern();
        buzz(BUZZ.tap);
        pulse(patCells[i], "good", 160);
        const cleared = patRound;
        patRound += 1;
        if (cleared > stats.pat) {
          stats.pat = cleared;
          saveStats();
          hubCall("score", stats.pat);
        }
        hubCall("event", "pattern-correct", { round: cleared });
        const token = runId;
        setTimeout(() => {
          if (token !== runId || mode !== "pattern") return;
          dealPattern();
        }, 150);
      }

      /* ---------- Gate 4: Count ---------- */
      const countBoard = $("panel-count");
      const countCells = [];
      for (let i = 0; i < 16; i += 1) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "ncell";
        onTap(cell, () => countClick(i));
        countBoard.appendChild(cell);
        countCells.push(cell);
      }
      let countNums = [];
      let countNext = 1;
      let countOpen = false;

      function paintCountHud(ms) {
        setHud("Next", countNext > 16 ? "-" : String(countNext), "Time", secs(ms) + " s");
      }
      function beginCount() {
        showPlay("count");
        countNext = 1;
        countOpen = false;
        live = true;
        countCells.forEach((cell) => {
          cell.textContent = "";
          cell.classList.remove("used", "good", "bad");
          cell.removeAttribute("aria-label");
        });
        paintCountHud(0);
        statusEl.textContent = "Get ready";
        const token = runId;
        setTimeout(async () => {
          if (token !== runId) return;
          await waitWhileFrozen();
          if (token !== runId) return;
          countNums = shuffle(Array.from({ length: 16 }, (_, n) => n + 1));
          countCells.forEach((cell, i) => {
            cell.textContent = String(countNums[i]);
            cell.setAttribute("aria-label", "Number " + countNums[i]);
          });
          statusEl.textContent = "Tap 1 to 16 in order.";
          countOpen = true;
          startClock({ onTick: (elapsed) => paintCountHud(elapsed) });
        }, 700);
      }
      function countClick(i) {
        if (!countOpen || frozen || mode !== "count" || !clock) return;
        const cell = countCells[i];
        if (countNums[i] !== countNext) {
          clock.elapsed += 1000;
          sndEarly();
          buzz(BUZZ.bad);
          pulse(cell, "bad", 300);
          statusEl.textContent = "Plus one second. Look for " + countNext + ".";
          return;
        }
        sndStep(countNext - 1);
        buzz(BUZZ.tap);
        cell.classList.add("used");
        countNext += 1;
        if (countNext <= 16) {
          paintCountHud(clock.elapsed);
          statusEl.textContent = "Tap 1 to 16 in order.";
          return;
        }
        const ms = Math.round(clock.elapsed);
        const token = runId;
        countOpen = false;
        stopClock();
        paintCountHud(ms);
        statusEl.textContent = "Cleared";
        const isBest = !stats.count || ms < stats.count;
        if (isBest) {
          stats.count = ms;
          saveStats();
          hubCall("score", Math.max(0, 600 - Math.round(ms / 100)));
        }
        hubCall("event", "count-completed", { ms });
        setTimeout(() => {
          if (token !== runId) return;
          finish("count", { value: secs(ms), unit: "s", line: "To clear 1 to 16", isBest });
        }, 450);
      }

      /* ---------- Answer dock, shared by Sums and Colour ---------- */
      let answerFn = null;
      answerBtns.forEach((btn, i) => onTap(btn, () => { if (answerFn && !frozen) answerFn(i); }));
      function setAnswers(labels, wordy) {
        answerBtns.forEach((btn, i) => {
          btn.textContent = labels[i];
          btn.classList.toggle("wordy", Boolean(wordy));
        });
      }
      function beginSprint(id, duration, onReady) {
        showPlay(id);
        live = true;
        answerFn = null;
        promptEl.textContent = "";
        promptEl.style.color = "";
        promptEl.classList.toggle("word", id === "colour");
        promptHint.textContent = "";
        setAnswers(["", "", "", ""], id === "colour");
        setBar(1);
        statusEl.textContent = "Get ready";
        const token = runId;
        setTimeout(async () => {
          if (token !== runId) return;
          await waitWhileFrozen();
          if (token !== runId) return;
          onReady(token);
        }, 700);
      }

      /* ---------- Gate 5: Quick Sums ---------- */
      let sumScore = 0;
      let sumAnswer = 0;
      let sumOptions = [];
      let sumLast = "";

      function makeSum(n) {
        const tier = n < 5 ? 0 : n < 12 ? 1 : n < 20 ? 2 : 3;
        const ops = tier === 0 ? ["+", "+", "−"] : tier === 1 ? ["+", "−", "×"] : ["+", "−", "×", "×"];
        const op = ops[rnd(0, ops.length - 1)];
        let a;
        let b;
        let ans;
        if (op === "×") {
          a = tier < 2 ? rnd(2, 6) : rnd(3, tier === 2 ? 9 : 12);
          b = rnd(2, 9);
          ans = a * b;
        } else {
          const hi = [9, 20, 50, 99][tier];
          a = rnd(tier === 0 ? 2 : 6, hi);
          b = rnd(2, tier === 0 ? 9 : Math.max(9, Math.floor(hi / 2)));
          if (op === "−" && b > a) [a, b] = [b, a];
          ans = op === "+" ? a + b : a - b;
        }
        const text = a + " " + op + " " + b;
        const pool = new Set();
        const deltas = shuffle([1, -1, 2, -2, 10, -10, 3, -3, op === "×" ? a : 5, op === "×" ? -b : -5]);
        for (const d of deltas) {
          if (pool.size >= 3) break;
          const v = ans + d;
          if (v >= 0 && v !== ans) pool.add(v);
        }
        let pad = 4;
        while (pool.size < 3) { pool.add(ans + pad); pad += 1; }
        return { text, ans, options: shuffle([ans, ...pool]) };
      }
      function dealSum() {
        let q = makeSum(sumScore);
        for (let tries = 0; tries < 6 && q.text === sumLast; tries += 1) q = makeSum(sumScore);
        sumLast = q.text;
        sumAnswer = q.ans;
        sumOptions = q.options;
        promptEl.textContent = q.text;
        flash(promptEl, "swap");
        setAnswers(sumOptions.map(String), false);
        setHud("Correct", String(sumScore), "Best", stats.sums ? String(stats.sums) : "-");
      }
      function beginSums() {
        sumScore = 0;
        sumLast = "";
        setHud("Correct", "0", "Best", stats.sums ? String(stats.sums) : "-");
        beginSprint("sums", SUMS_MS, (token) => {
          statusEl.textContent = "Pick the answer.";
          dealSum();
          answerFn = (i) => {
            if (mode !== "sums" || !clock) return;
            if (sumOptions[i] === sumAnswer) {
              sumScore += 1;
              sndTick();
              buzz(BUZZ.tap);
              statusEl.textContent = "Pick the answer.";
            } else {
              clock.elapsed += 3000;
              sndEarly();
              buzz(BUZZ.bad);
              statusEl.textContent = "Minus three seconds.";
              flash(promptEl, "bad");
            }
            dealSum();
          };
          startClock({
            duration: SUMS_MS,
            onTick: (elapsed) => setBar(1 - elapsed / SUMS_MS),
            onEnd: () => {
              if (token !== runId) return;
              answerFn = null;
              const isBest = sumScore > stats.sums;
              if (isBest) {
                stats.sums = sumScore;
                saveStats();
                hubCall("score", sumScore);
              }
              hubCall("event", "sums-completed", { correct: sumScore });
              hubCall("gameOver", stats.sums, 0);
              finish("sums", { value: String(sumScore), line: sumScore === 1 ? "Correct answer in 45 seconds" : "Correct answers in 45 seconds", isBest });
            },
          });
        });
      }

      /* ---------- Gate 6: Colour Clash ---------- */
      const INKS = [
        { name: "Red", hex: "#ff5d6c" },
        { name: "Blue", hex: "#5aa9ff" },
        { name: "Green", hex: "#3dd68c" },
        { name: "Gold", hex: "#f0c15a" },
      ];
      let colourScore = 0;
      let colourInk = 0;
      let colourLast = "";

      function dealColour() {
        let word;
        let ink;
        do {
          word = rnd(0, 3);
          ink = Math.random() < 0.2 ? word : (word + rnd(1, 3)) % 4;
        } while (word + "-" + ink === colourLast);
        colourLast = word + "-" + ink;
        colourInk = ink;
        promptEl.textContent = INKS[word].name;
        promptEl.style.color = INKS[ink].hex;
        flash(promptEl, "swap");
        setHud("Correct", String(colourScore), "Best", stats.colour ? String(stats.colour) : "-");
      }
      function beginColour() {
        colourScore = 0;
        colourLast = "";
        setHud("Correct", "0", "Best", stats.colour ? String(stats.colour) : "-");
        beginSprint("colour", COLOUR_MS, (token) => {
          statusEl.textContent = "Which colour is the ink?";
          promptHint.textContent = "Answer with the ink colour, not the word.";
          setAnswers(INKS.map((c) => c.name), true);
          dealColour();
          answerFn = (i) => {
            if (mode !== "colour" || !clock) return;
            if (i === colourInk) {
              colourScore += 1;
              sndTick();
              buzz(BUZZ.tap);
              statusEl.textContent = "Which colour is the ink?";
            } else {
              clock.elapsed += 2000;
              sndEarly();
              buzz(BUZZ.bad);
              statusEl.textContent = "Minus two seconds.";
              flash(promptEl, "bad");
            }
            dealColour();
          };
          startClock({
            duration: COLOUR_MS,
            onTick: (elapsed) => setBar(1 - elapsed / COLOUR_MS),
            onEnd: () => {
              if (token !== runId) return;
              answerFn = null;
              promptEl.style.color = "";
              const isBest = colourScore > stats.colour;
              if (isBest) {
                stats.colour = colourScore;
                saveStats();
                hubCall("score", colourScore);
              }
              hubCall("event", "colour-completed", { correct: colourScore });
              hubCall("gameOver", stats.colour, 0);
              finish("colour", { value: String(colourScore), line: colourScore === 1 ? "Correct answer in 30 seconds" : "Correct answers in 30 seconds", isBest });
            },
          });
        });
      }

      /* ---------- Starting, help, pause, settings ---------- */
      const BEGIN = {
        sequence: beginSequence,
        reaction: beginReaction,
        pattern: beginPattern,
        count: beginCount,
        sums: beginSums,
        colour: beginColour,
      };
      function loadSeen() {
        const raw = readJSON("rbt-seen");
        return Array.isArray(raw) ? raw.filter((id) => ORDER.includes(id)) : [];
      }
      let seen = loadSeen();

      function launch(which) {
        closeSheet();
        unlockAudio();
        stopAll();
        hubCall("ready");
        BEGIN[which]();
      }
      function startMode(which) {
        if (!BEGIN[which]) return;
        if (!seen.includes(which)) {
          seen.push(which);
          store.set("rbt-seen", JSON.stringify(seen));
          const info = DRILLS[which];
          stopAll();
          openSheet({
            title: info.title,
            paragraphs: [info.summary],
            steps: info.steps,
            primary: "Play",
            secondary: "Back",
            onPrimary: () => launch(which),
            onSecondary: () => { closeSheet(); if (!views.menu.classList.contains("on")) showMenu(); },
          });
          return;
        }
        launch(which);
      }

      function freezeForSheet() {
        const reactionLive = mode === "reaction" && (reactState === "waiting" || reactState === "go");
        setFrozen(true);
        if (reactionLive) {
          reactEpoch += 1;
          clearReactTimer();
          paintReaction("idle", "Tap to start", "Ready");
          statusEl.textContent = "Try reset. Tap to arm again.";
        }
        return reactionLive;
      }
      function openHelp() {
        if (!mode || frozen) return;
        const info = DRILLS[mode];
        freezeForSheet();
        const resume = () => { closeSheet(); setFrozen(false); };
        openSheet({
          title: info.title,
          paragraphs: [info.summary],
          steps: info.steps,
          primary: "Resume",
          onPrimary: resume,
          onDismiss: resume,
        });
      }
      function openPause() {
        if (!mode || frozen || !live) return;
        const reactionLive = freezeForSheet();
        const resume = () => { closeSheet(); setFrozen(false); };
        openSheet({
          title: "Paused",
          paragraphs: [
            reactionLive
              ? "This reaction try restarts when you resume."
              : "The board is hidden and the clock is stopped until you resume.",
          ],
          primary: "Resume",
          secondary: "Main menu",
          onPrimary: resume,
          onSecondary: () => { closeSheet(); showMenu(); },
          onDismiss: resume,
        });
      }

      function openSettings() {
        openSheet({
          title: "Settings",
          build: (host) => {
            const row = (label, hint, pressed, onToggle) => {
              const wrap = document.createElement("div");
              wrap.className = "setting";
              const text = document.createElement("span");
              text.textContent = label;
              const small = document.createElement("small");
              small.textContent = hint;
              text.appendChild(small);
              const sw = document.createElement("button");
              sw.type = "button";
              sw.className = "switch";
              sw.setAttribute("aria-label", label);
              sw.setAttribute("aria-pressed", pressed ? "true" : "false");
              sw.addEventListener("click", () => {
                const next = sw.getAttribute("aria-pressed") !== "true";
                sw.setAttribute("aria-pressed", next ? "true" : "false");
                onToggle(next);
              });
              wrap.appendChild(text);
              wrap.appendChild(sw);
              host.appendChild(wrap);
            };
            row("Sound", "Tones for taps, hits and misses", !muted, (on) => { unlockAudio(); setMuted(!on); });
            row("Vibration", "Short buzz on taps, where the phone supports it", haptics, (on) => {
              haptics = on;
              store.set("rbt-haptics", on ? "1" : "0");
              if (on) buzz(BUZZ.good);
            });
            const extra = document.createElement("div");
            extra.className = "sheet-extra";
            const reset = document.createElement("button");
            reset.type = "button";
            reset.className = "btn danger";
            reset.textContent = "Reset all bests";
            reset.addEventListener("click", confirmReset);
            extra.appendChild(reset);
            host.appendChild(extra);
          },
          primary: "Done",
          onPrimary: closeSheet,
        });
      }
      function confirmReset() {
        openSheet({
          title: "Reset bests?",
          paragraphs: ["Your best scores for all six drills on this device will clear. Your streak and today's gates stay. This cannot be undone."],
          primary: "Reset",
          danger: true,
          secondary: "Cancel",
          onPrimary: () => {
            stats = { seq: 0, react: null, pat: 0, reacts: [], count: null, sums: 0, colour: 0 };
            saveStats();
            closeSheet();
            paintHome();
          },
          onSecondary: closeSheet,
        });
      }

      $("settings-btn").addEventListener("click", openSettings);
      $("help-btn").addEventListener("click", openHelp);
      $("pause-btn").addEventListener("click", openPause);
      $("back-btn").addEventListener("click", showMenu);

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
          if (views.menu.classList.contains("on")) paintHome();
          return;
        }
        if (mode && live && !frozen && sheet.hidden) openPause();
      });

      document.addEventListener("keydown", (event) => {
        if (event.repeat) return;
        if (!sheet.hidden) {
          if (event.key === "Escape") sheetDismissFn();
          if (event.key === "Tab") {
            const nodes = Array.from(sheet.querySelectorAll("button")).filter((btn) => !btn.hidden);
            if (!nodes.length) return;
            const first = nodes[0];
            const last = nodes[nodes.length - 1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
          return;
        }
        if (event.key === "Escape" && mode) { openPause(); return; }
        if (!mode || frozen) return;
        if (mode === "sequence" && event.key >= "1" && event.key <= "9") seqClick(Number(event.key) - 1);
        if (mode === "reaction" && (event.key === " " || event.key === "Enter") && document.activeElement !== arena) {
          event.preventDefault();
          arena.click();
        }
        if ((mode === "sums" || mode === "colour") && event.key >= "1" && event.key <= "4" && answerFn) {
          answerFn(Number(event.key) - 1);
        }
      });

      paintHome();
    })();
  </script>
</body>
</html>
